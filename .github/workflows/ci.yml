# Build, lint and test on every push and pull request.
#
# The block models are not committed: they are generated from the FBX originals under
# Assets/ by scripts/convert-blocks.mjs, which npm's pretest and prebuild hooks run.
# So this workflow regenerates them from source, and a conversion that shifts a
# dimension or a pivot fails here rather than in a level.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Convert the block kit and check it against the manifest
        run: npm run convert:blocks

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npx vite build

      - name: Report bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* dist/index.html | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the Chromium build Playwright needs
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        # The Playwright config builds the project and serves dist/ itself.
        run: npx playwright test

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .agent_temp/screenshots/
          if-no-files-found: warn
          retention-days: 14
